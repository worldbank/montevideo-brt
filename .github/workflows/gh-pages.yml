name: Publish to GitHub Pages
on:
  push:
    branches:
      - main

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: "pip"
      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then
            # Avoid installing the local project from requirements ('.' or '-e .')
            grep -vE '^\s*(\.|-e\s+\.)\s*$' requirements.txt > /tmp/requirements-no-local.txt
            if [ -s /tmp/requirements-no-local.txt ]; then
              pip install -r /tmp/requirements-no-local.txt
            fi
          fi
          pip install "docutils==0.17.1" "jupyter-book>=1,<2"
      - name: Build Juputer Book Documentation
        run: |
          jupyter-book build . --config docs/_config.yml --toc docs/_toc.yml
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && job.status == 'success'
        with:
          path: "_build/html"

  deploy-book:
    needs: build-book
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4